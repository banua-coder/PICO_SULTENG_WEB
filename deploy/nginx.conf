# PICO web nginx config (ADR-0104, contract C5). Mirrors scripts/serve-dist.ts, the routing reference used by e2e.
# Goes to /etc/nginx/conf.d/default.conf of nginxinc/nginx-unprivileged (http context, port 8080, user nginx).
# Why one set of add_header at server level: add_header in a location drops every inherited one, so classes are chosen by map.

# --- cache class by final URI (after try_files, so a page is /<route>/index.html) ---
map $uri $cache_control {
    default                          "public, max-age=86400";
    ~^/assets/                       "public, max-age=31536000, immutable";   # hashed by Vite
    ~/index\.html$                   "no-cache";
    /404.html                        "no-cache";
    /sitemap.xml                     "no-cache";
    ~^/data/.+\.json$                "no-cache";                              # rebuilt every deploy, not hashed
    /theme-init.js                   "no-cache";
    /healthz                         "no-store";
}

map $uri $content_disposition {
    default                          "";
    ~^/unduh/[^/]+\.(csv|xlsx)$      "attachment";
}

# types adds to mime.types (same context); charset only for text types
types {
    text/csv csv;
    application/manifest+json webmanifest;
}
charset utf-8;
charset_types text/css text/plain text/csv text/xml application/javascript application/json application/manifest+json image/svg+xml;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;            # Location stays "/data": behind Traefik the inner port 8080 must not leak
    port_in_redirect off;
    client_max_body_size 1k;          # static site, no uploads
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    etag on;

    # --- compression: gzip only (the official image has no brotli module). Level 5, nothing under 256 B ---
    # Already compressed: png, ico, woff2, xlsx (zip). Not listed on purpose.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css text/plain text/csv text/xml application/xml application/javascript text/javascript
               application/json application/ld+json application/manifest+json image/svg+xml;

    # --- headers on every response, errors included. HSTS and frame-deny come from Traefik secure-headers@file ---
    add_header Cache-Control $cache_control always;
    add_header Content-Disposition $content_disposition always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    # script-src 'self': the only inline script is the JSON state block (type application/json, not executed). The theme
    #   script is /theme-init.js. style-src-attr allows the style="" attributes of the prerendered HTML (no inline <style>).
    # img-src https: because infographics come from i.ibb.co and other hosts the API returns.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://pico-api.banuacoder.com; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Unknown path: 404.html with status 404 (never the SPA shell with 200). 404.html itself is internal, so a direct request is a 404 too.
    error_page 404 /404.html;
    location = /404.html { internal; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /id/ prefix: 301 to the same path without it, trailing slash dropped in the same hop (/id/en/ -> /en/ is kept)
    location = /id          { return 301 /; }
    location = /id/         { return 301 /; }
    location = /id/en/      { return 301 /en/; }
    location ~ ^/id(/.*)$   { rewrite ^/id/(.+?)/*$ /$1 permanent; }

    # Trailing slash: 301 to none. Beranda keeps / and /en/
    location = /en/ { try_files /en/index.html =404; }
    location ~ ^/(.+?)/+$ { return 301 /$1$is_args$args; }

    # A path with an extension is a file; one without is a prerendered route directory
    location ~ [^/]\.[^/]*$ { try_files $uri =404; }
    location / { try_files $uri/index.html =404; }
}
