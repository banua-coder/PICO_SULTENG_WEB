name: CI

on:
  push:
    branches: [main, master, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .cache
          key: series-${{ github.run_id }}
          restore-keys: series-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Built site checks (114 pages, titles, canonical, sitemap, links) and size budget
        run: |
          pnpm check:dist
          pnpm check:budget

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .cache
          key: series-${{ github.run_id }}-${{ matrix.shard }}
          restore-keys: series-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      # the smoke suite (axe on every route, id and en, light and dark, Chromium and WebKit) and the page suites
      - run: pnpm e2e --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            test-results
            playwright-report
          retention-days: 7
